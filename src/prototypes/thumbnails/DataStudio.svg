  <rect x="430" y="176" width="80" height="8" rx="2" fill="#22C55E" opacity="0.7"/>
  <rect x="200" y="204" width="180" height="8" rx="2" fill="#4A90E2"/>
  <rect x="430" y="204" width="80" height="8" rx="2" fill="#22C55E" opacity="0.7"/>
  <rect x="200" y="232" width="200" height="8" rx="2" fill="#4A90E2"/>
  <rect x="430" y="232" width="80" height="8" rx="2" fill="#22C55E" opacity="0.7"/>
