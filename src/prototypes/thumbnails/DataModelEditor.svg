  <rect x="606" y="360" width="174" height="40" rx="8" stroke-width="1" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="614" y="374" width="100" height="12" rx="3" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <circle cx="760" cy="380" r="12" style="fill: var(--rd-sys-color-content-primary)"/>

  <!-- Title -->
  <text x="400" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="13" text-anchor="middle" font-weight="400" style="fill: var(--rd-sys-color-content-secondary)">Data model editor</text>
</svg>
