  <rect x="218" y="118" width="80" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="218" y="132" width="48" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>

