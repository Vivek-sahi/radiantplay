  <rect x="626" y="154" width="130" height="24" rx="12" stroke="#818CF8" stroke-width="1.5" style="fill: var(--rd-sys-color-background-base)"/>
  <rect x="636" y="160" width="12" height="12" rx="2" fill="#818CF8"/>
  <rect x="652" y="163" width="76" height="6" rx="2" style="fill: var(--rd-sys-color-content-brand)"/>

