  <rect x="200" y="24" width="48" height="24" rx="4" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="200" y="24" width="48" height="24" rx="4" style="fill: var(--rd-sys-color-content-primary)"/>
