  <rect x="598" y="48" width="186" height="12" style="fill: var(--rd-sys-color-background-sunken)"/>
  <circle cx="618" cy="38" r="10" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="634" y="33" width="64" height="10" rx="3" style="fill: var(--rd-sys-color-content-primary)"/>
  <!-- Context chip -->
  <rect x="720" y="28" width="52" height="20" rx="10" stroke="#818CF8" stroke-width="1" style="fill: var(--rd-sys-color-background-information)"/>
  <rect x="726" y="34" width="36" height="8" rx="2" fill="#818CF8"/>

