  <rect x="390" y="72" width="160" height="80" rx="6" stroke-width="1.5" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="390" y="72" width="160" height="24" rx="6" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="390" y="90" width="160" height="6" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="398" y="78" width="80" height="10" rx="2" opacity="0.8" style="fill: var(--rd-sys-color-background-base)"/>
  <rect x="398" y="104" width="60" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="398" y="118" width="80" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="398" y="132" width="48" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>

