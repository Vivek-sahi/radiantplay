  <rect x="371" y="106" width="18" height="12" rx="3" stroke="#818CF8" stroke-width="1" style="fill: var(--rd-sys-color-background-information)"/>
  <rect x="374" y="110" width="12" height="4" rx="1" fill="#818CF8"/>

  <!-- fact_customer card -->
  <rect x="210" y="220" width="160" height="80" rx="6" stroke-width="1.5" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="210" y="220" width="160" height="24" rx="6" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="210" y="238" width="160" height="6" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="218" y="226" width="80" height="10" rx="2" opacity="0.8" style="fill: var(--rd-sys-color-background-base)"/>
  <rect x="218" y="252" width="60" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="218" y="266" width="80" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="218" y="280" width="48" height="8" rx="2" style="fill: var(--rd-sys-color-background-secondary-action)"/>

