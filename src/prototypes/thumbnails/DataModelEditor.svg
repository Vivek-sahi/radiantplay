  <!-- Table items -->
  <rect x="24" y="72" width="144" height="28" rx="4" style="fill: var(--rd-sys-color-background-information)"/>
  <rect x="28" y="80" width="80" height="12" rx="2" fill="#818CF8"/>
  <rect x="24" y="108" width="144" height="28" rx="4" stroke-width="1" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="28" y="116" width="96" height="12" rx="2" style="fill: var(--rd-sys-color-content-tertiary)"/>
  <rect x="24" y="144" width="144" height="28" rx="4" stroke-width="1" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="28" y="152" width="72" height="12" rx="2" style="fill: var(--rd-sys-color-content-tertiary)"/>
  <rect x="24" y="180" width="144" height="28" rx="4" stroke-width="1" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="28" y="188" width="88" height="12" rx="2" style="fill: var(--rd-sys-color-content-tertiary)"/>
  <rect x="24" y="216" width="144" height="28" rx="4" stroke-width="1" style="fill: var(--rd-sys-color-background-base); stroke: var(--rd-sys-color-border-subtle)"/>
  <rect x="28" y="224" width="64" height="12" rx="2" style="fill: var(--rd-sys-color-content-tertiary)"/>

