  <rect x="610" y="76" width="162" height="110" rx="6" style="fill: var(--rd-sys-color-background-sunken)"/>
  <circle cx="691" cy="100" r="14" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <rect x="660" y="120" width="62" height="10" rx="3" style="fill: var(--rd-sys-color-content-primary)"/>
  <rect x="648" y="136" width="86" height="8" rx="3" style="fill: var(--rd-sys-color-content-tertiary)"/>
