  <rect x="56" y="187" width="100" height="8" rx="3" style="fill: var(--rd-sys-color-content-tertiary)"/>
  <rect x="12" y="216" width="216" height="56" rx="8" fill="transparent"/>
  <circle cx="36" cy="244" r="12" fill="#72C9A8"/>
  <rect x="56" y="235" width="100" height="10" rx="3" style="fill: var(--rd-sys-color-background-inset)"/>
