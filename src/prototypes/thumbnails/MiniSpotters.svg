  <rect x="540" y="308" width="220" height="28" rx="10" fill-opacity="0.1" style="fill: color-mix(in srgb, var(--rd-sys-color-content-brand) 55%, var(--rd-sys-color-background-base))"/>
  <rect x="556" y="318" width="160" height="8" rx="3" style="fill: var(--rd-sys-color-background-inset)"/>
