<svg width="320" height="180" viewBox="0 0 320 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="320" height="180" style="fill: var(--rd-sys-color-background-sunken)"/>
  
  <!-- Modal Backdrop Overlay -->
  <rect x="20" y="20" width="280" height="140" rx="4" opacity="0.3" style="fill: var(--rd-sys-color-content-primary)"/>
  
  <!-- Modal Container -->
  <rect x="60" y="35" width="200" height="110" rx="6" filter="url(#shadow)" style="fill: var(--rd-sys-color-background-base)"/>
  
  <!-- Modal Header -->
  <rect x="60" y="35" width="200" height="32" style="fill: var(--rd-sys-color-background-base)"/>
  <line x1="60" y1="67" x2="260" y2="67" style="stroke: var(--rd-sys-color-border-subtle)"/>
  <text x="72" y="55" font-family="Arial" font-size="11" font-weight="600" style="fill: var(--rd-sys-color-content-primary)">Modal Title</text>
  <circle cx="248" cy="51" r="8" style="fill: var(--rd-sys-color-background-sunken)"/>
  <path d="M244 47L252 55M252 47L244 55" stroke-width="1.5" stroke-linecap="round" style="stroke: var(--rd-sys-color-content-secondary)"/>
  
  <!-- Modal Content -->
  <rect x="72" y="75" width="176" height="30" rx="4" style="fill: var(--rd-sys-color-background-accent-purple-subtle)"/>
  <text x="160" y="94" font-family="Arial" font-size="8" text-anchor="middle" style="fill: var(--rd-sys-color-content-secondary)">Content Area</text>
  
  <!-- Modal Footer -->
  <rect x="60" y="113" width="200" height="32" rx="0 0 6 6" style="fill: var(--rd-sys-color-background-sunken)"/>
  <line x1="60" y1="113" x2="260" y2="113" style="stroke: var(--rd-sys-color-border-subtle)"/>
  
  <!-- Cancel Button -->
  <rect x="180" y="120" width="32" height="18" rx="9" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <text x="196" y="132" font-family="Arial" font-size="7" text-anchor="middle" style="fill: var(--rd-sys-color-content-primary)">Cancel</text>
  
  <!-- Primary Button -->
  <rect x="218" y="120" width="32" height="18" rx="9" style="fill: var(--rd-sys-color-content-brand)"/>
  <text x="234" y="132" font-family="Arial" font-size="7" text-anchor="middle" style="fill: var(--rd-sys-color-background-base)">Action</text>
  
  <!-- Size Labels -->
  <text x="40" y="170" font-family="Arial" font-size="8" style="fill: var(--rd-sys-color-content-secondary)">M1</text>
  <text x="100" y="170" font-family="Arial" font-size="8" style="fill: var(--rd-sys-color-content-secondary)">M2</text>
  <text x="160" y="170" font-family="Arial" font-size="8" style="fill: var(--rd-sys-color-content-secondary)">M3</text>
  <text x="220" y="170" font-family="Arial" font-size="8" style="fill: var(--rd-sys-color-content-secondary)">M4</text>
  
  <!-- Size Indicator Dots -->
  <circle cx="50" cy="170" r="3" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <circle cx="110" cy="170" r="3" style="fill: var(--rd-sys-color-content-brand)"/>
  <circle cx="170" cy="170" r="3" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  <circle cx="230" cy="170" r="3" style="fill: var(--rd-sys-color-background-secondary-action)"/>
  
  <!-- Shadow Filter -->
  <defs>
    <filter id="shadow" x="-4" y="-4" width="208" height="118" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#192331" flood-opacity="0.16"/>
    </filter>
  </defs>
</svg>
