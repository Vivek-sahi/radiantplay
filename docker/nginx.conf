server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: RadiantPlay uses BrowserRouter, so any path that isn't a
    # real file must return index.html and let React Router handle routing.
    # Without this, shared deep links and page refreshes 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
