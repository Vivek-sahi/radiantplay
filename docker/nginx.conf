server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: RadiantPlay uses BrowserRouter, so any path that isn't a
    # real file must return index.html and let React Router handle routing.
    # Without this, shared deep links and page refreshes 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # No HTML may be cached. Vite hashes every bundle, so a cached index.html
    # keeps pointing at the previous deploy's files until a hard refresh. Pages
    # in public/ are added and edited without a filename change, so a browser
    # that cached one before it existed keeps serving the SPA fallback it got
    # instead. The regex location beats the prefix one, so a missing .html
    # returns 404 rather than silently serving the app shell. SPA routes carry
    # no .html, and the fallback above reaches index.html through here.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
