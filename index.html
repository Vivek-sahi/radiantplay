<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radiant Play</title>
    <style>
      /* Plain (Radiant brand font) — loaded from /public/fonts so it works for everyone,
         not only developers who happen to have Plain installed system-wide. local() is
         kept as a faster fallback for those who do. */
      @font-face {
        font-family: 'Plain';
        src: url('/fonts/Plain-Light.otf') format('opentype'),
             local('Plain Light');
        font-weight: 375;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Plain';
        src: url('/fonts/Plain-LightIta.otf') format('opentype'),
             local('Plain Light Italic');
        font-weight: 375;
        font-style: italic;
        font-display: swap;
      }
      @font-face {
        font-family: 'Plain';
        src: url('/fonts/Plain-Regular.otf') format('opentype'),
             local('Plain Regular'), local('Plain Light');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Plain';
        src: url('/fonts/Plain-Medium.ttf') format('truetype'),
             local('Plain Medium');
        font-weight: 500;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: 'Plain';
        src: local('Plain Semibold'), local('Plain Extrabold'),
             url('/fonts/Plain-Medium.ttf') format('truetype');
        font-weight: 600;
        font-style: normal;
        font-display: swap;
      }
    </style>
    <script>
      // Set the saved theme before first paint, so a reload never flashes the wrong one.
      // Keep the key and the light default in step with src/context/ThemeContext.tsx.
      (function () {
        var mode = 'light';
        try {
          var stored = localStorage.getItem('rp-theme-mode');
          if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored;
        } catch (e) {}
        if (mode === 'system') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', mode);
      })();
    </script>
    <link rel="preload" href="/fonts/geist/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
